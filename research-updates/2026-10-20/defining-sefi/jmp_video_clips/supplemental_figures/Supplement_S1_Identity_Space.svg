<text x="2572" y="555" font-size="96" text-anchor="middle" class="math" font-weight="normal">I<tspan dy="12" font-size="68%">W</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="2572" y="710" font-size="52" text-anchor="middle" class="" font-weight="bold">Warp Expression</text>
<text x="1500" y="1010" font-size="76" text-anchor="middle" class="math" font-weight="normal">I = (I<tspan dy="12" font-size="68%">O</tspan><tspan dy="-12">&#8203;</tspan>, I<tspan dy="12" font-size="68%">A</tspan><tspan dy="-12">&#8203;</tspan>, I<tspan dy="12" font-size="68%">S</tspan><tspan dy="-12">&#8203;</tspan>, I<tspan dy="12" font-size="68%">W</tspan><tspan dy="-12">&#8203;</tspan>) ∈ ℐ = ℝ<tspan dy="-20" font-size="68%">4</tspan><tspan dy="20">&#8203;</tspan></text>
<text x="1500" y="1195" font-size="62" text-anchor="middle" class="math" font-weight="normal">g<tspan dy="12" font-size="68%">I</tspan><tspan dy="-12">&#8203;</tspan> = diag(α, β, γ, δ) ;  α, β, γ, δ &gt; 0</text>
<text x="1500" y="1400" font-size="62" text-anchor="middle" class="math" font-weight="normal">Displacement components: (d<tspan dy="12" font-size="68%">O</tspan><tspan dy="-12">&#8203;</tspan>, d<tspan dy="12" font-size="68%">A</tspan><tspan dy="-12">&#8203;</tspan>, d<tspan dy="12" font-size="68%">S</tspan><tspan dy="-12">&#8203;</tspan>, d<tspan dy="12" font-size="68%">W</tspan><tspan dy="-12">&#8203;</tspan>)</text>
<line x1="120" y1="1650" x2="2880" y2="1650" stroke="#c6d0d8" stroke-width="3"/>
<text x="120" y="1720" font-size="36" text-anchor="start" class="muted" font-weight="normal">Internal coordinates of the proposed model; no experimental coordinate measurements are shown.</text>
