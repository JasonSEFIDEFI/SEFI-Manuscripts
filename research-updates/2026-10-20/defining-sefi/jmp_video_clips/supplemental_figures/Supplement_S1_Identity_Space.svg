<text x="1142" y="555" font-size="96" text-anchor="middle" class="math" font-weight="normal">I<tspan dy="12" font-size="68%">A</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="1142" y="710" font-size="52" text-anchor="middle" class="" font-weight="bold">Authorship</text>
<rect x="1550" y="430" width="615" height="380" rx="18" fill="#176779" fill-opacity="0.045" stroke="#176779" stroke-width="4"/>
