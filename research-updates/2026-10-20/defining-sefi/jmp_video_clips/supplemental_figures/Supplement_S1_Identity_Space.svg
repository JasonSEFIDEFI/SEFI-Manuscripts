<text x="120" y="140" font-size="76" text-anchor="start" class="" font-weight="bold">Proposed identity-space coordinates</text>
<text x="120" y="218" font-size="43" text-anchor="start" class="muted" font-weight="normal">Four internal model coordinates, with the metric stated in the manuscript</text>
