<text x="427" y="555" font-size="96" text-anchor="middle" class="math" font-weight="normal">I<tspan dy="12" font-size="68%">O</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="427" y="710" font-size="52" text-anchor="middle" class="" font-weight="bold">Origin</text>
