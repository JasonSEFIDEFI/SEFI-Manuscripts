<text x="1500" y="470" font-size="78" text-anchor="middle" class="math" font-weight="normal">T = −g<tspan dy="-20" font-size="68%">μν</tspan><tspan dy="20">&#8203;</tspan>∇<tspan dy="12" font-size="68%">μ</tspan><tspan dy="-12">&#8203;</tspan>∇<tspan dy="12" font-size="68%">ν</tspan><tspan dy="-12">&#8203;</tspan> + g<tspan dy="12" font-size="68%">I</tspan><tspan dy="-12">&#8203;</tspan><tspan dy="-20" font-size="68%">ab</tspan><tspan dy="20">&#8203;</tspan>∇<tspan dy="12" font-size="68%">a</tspan><tspan dy="-12">&#8203;</tspan>∇<tspan dy="12" font-size="68%">b</tspan><tspan dy="-12">&#8203;</tspan></text>
