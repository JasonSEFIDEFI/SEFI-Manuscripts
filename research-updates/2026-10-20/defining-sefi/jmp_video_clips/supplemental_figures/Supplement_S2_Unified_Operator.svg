<text x="1500" y="889" font-size="68" text-anchor="middle" class="math" font-weight="normal">V<tspan dy="12" font-size="68%">geom</tspan><tspan dy="-12">&#8203;</tspan> = λ<tspan dy="12" font-size="68%">1</tspan><tspan dy="-12">&#8203;</tspan>κ<tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan> + λ<tspan dy="12" font-size="68%">2</tspan><tspan dy="-12">&#8203;</tspan>τ<tspan dy="12" font-size="68%">g</tspan><tspan dy="-12">&#8203;</tspan><tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan></text>
