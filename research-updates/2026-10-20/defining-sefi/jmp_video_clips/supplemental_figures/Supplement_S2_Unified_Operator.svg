<text x="1500" y="1429" font-size="65" text-anchor="middle" class="math" font-weight="normal">V<tspan dy="12" font-size="68%">dyn</tspan><tspan dy="-12">&#8203;</tspan> = η<tspan dy="12" font-size="68%">1</tspan><tspan dy="-12">&#8203;</tspan>‖dI/dτ‖<tspan dy="12" font-size="68%">I</tspan><tspan dy="-12">&#8203;</tspan><tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan> + η<tspan dy="12" font-size="68%">2</tspan><tspan dy="-12">&#8203;</tspan>‖d<tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan>I/dτ<tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan>‖<tspan dy="12" font-size="68%">I</tspan><tspan dy="-12">&#8203;</tspan><tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan></text>
