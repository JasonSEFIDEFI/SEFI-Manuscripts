<text x="1982" y="600" font-size="56" text-anchor="middle" class="" font-weight="bold">Candidate mode equation</text>
<text x="1982" y="805" font-size="110" text-anchor="middle" class="math" font-weight="normal">TΨ<tspan dy="12" font-size="68%">n</tspan><tspan dy="-12">&#8203;</tspan> = λ<tspan dy="12" font-size="68%">n</tspan><tspan dy="-12">&#8203;</tspan>Ψ<tspan dy="12" font-size="68%">n</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="1982" y="1010" font-size="48" text-anchor="middle" class="muted" font-weight="normal">Modes and spectral values must be calculated.</text>
<text x="1500" y="1390" font-size="55" text-anchor="middle" class="" font-weight="normal">Particle identification requires masses, charges, spins and couplings.</text>
