<text x="120" y="140" font-size="76" text-anchor="start" class="" font-weight="bold">Candidate eigenmode relation</text>
<text x="120" y="218" font-size="43" text-anchor="start" class="muted" font-weight="normal">A mathematical problem to solve, without invented eigenfunctions or spectral values</text>
