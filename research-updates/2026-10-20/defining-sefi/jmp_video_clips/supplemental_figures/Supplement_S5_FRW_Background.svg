<text x="1500" y="1515" font-size="48" text-anchor="middle" class="" font-weight="normal">The spatial derivative term scales as a(t)<tspan dy="-20" font-size="68%">−2</tspan><tspan dy="20">&#8203;</tspan>; the full operator requires separate analysis.</text>
