<text x="1840" y="468" font-size="39" text-anchor="start" class="" font-weight="bold">Local Frenet-Serret frame</text>
<text x="1840" y="542" font-size="44" text-anchor="start" class="math" font-weight="normal">T: tangent;  N: normal;  B: binormal</text>
<text x="1840" y="607" font-size="35" text-anchor="start" class="muted" font-weight="normal">τ parametrizes the worldline.</text>
<line x1="1840" y1="661" x2="2880" y2="661" stroke="#c6d0d8" stroke-width="3"/>
<text x="1840" y="743" font-size="39" text-anchor="start" class="" font-weight="bold">Worldline curvature</text>
<text x="1840" y="819" font-size="58" text-anchor="start" class="math" font-weight="normal">κ(τ) = ‖DT<tspan dy="-20" font-size="68%">μ</tspan><tspan dy="20">&#8203;</tspan>/dτ‖</text>
<text x="1840" y="885" font-size="35" text-anchor="start" class="muted" font-weight="normal">Covariant change of the tangent</text>
<line x1="1840" y1="939" x2="2880" y2="939" stroke="#c6d0d8" stroke-width="3"/>
<text x="1840" y="1021" font-size="39" text-anchor="start" class="" font-weight="bold">Worldline torsion</text>
<text x="1840" y="1097" font-size="58" text-anchor="start" class="math" font-weight="normal">τ<tspan dy="12" font-size="68%">g</tspan><tspan dy="-12">&#8203;</tspan>(τ) = B<tspan dy="12" font-size="68%">μ</tspan><tspan dy="-12">&#8203;</tspan> DN<tspan dy="-20" font-size="68%">μ</tspan><tspan dy="20">&#8203;</tspan>/dτ</text>
<text x="1840" y="1163" font-size="35" text-anchor="start" class="muted" font-weight="normal">Binormal component of the normal derivative</text>
<line x1="1840" y1="1217" x2="2880" y2="1217" stroke="#c6d0d8" stroke-width="3"/>
<text x="1840" y="1299" font-size="39" text-anchor="start" class="" font-weight="bold">Geometric operator contribution</text>
<text x="1840" y="1375" font-size="58" text-anchor="start" class="math" font-weight="normal">V<tspan dy="12" font-size="68%">geom</tspan><tspan dy="-12">&#8203;</tspan> = λ<tspan dy="12" font-size="68%">1</tspan><tspan dy="-12">&#8203;</tspan>κ<tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan> + λ<tspan dy="12" font-size="68%">2</tspan><tspan dy="-12">&#8203;</tspan>τ<tspan dy="12" font-size="68%">g</tspan><tspan dy="-12">&#8203;</tspan><tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan></text>
<text x="1840" y="1441" font-size="35" text-anchor="start" class="muted" font-weight="normal">As specified in the unified operator</text>
