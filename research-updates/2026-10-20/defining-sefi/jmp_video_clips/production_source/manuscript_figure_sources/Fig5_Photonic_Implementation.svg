<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1800" viewBox="0 0 3000 1800">
<rect width="3000" height="1800" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#162332}.math{font-family:Cambria,"Times New Roman",serif}.muted{fill:#475766}</style>
<defs>
<marker id="curve" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 Z" fill="#2a6d94"/></marker>
<marker id="tangent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 Z" fill="#2a6d94"/></marker>
<marker id="normal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 Z" fill="#b45b23"/></marker>
<marker id="binormal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 Z" fill="#638348"/></marker>
</defs>
<text x="120" y="140" font-size="76" text-anchor="start" class="" font-weight="bold">Proposed photonic implementation</text>
<text x="120" y="218" font-size="43" text-anchor="start" class="muted" font-weight="normal">Optical propagation, selected observables and geometric syndrome representation</text>
<line x1="120" y1="263" x2="2880" y2="263" stroke="#c6d0d8" stroke-width="3"/>
<text x="120" y="350" font-size="43" text-anchor="start" class="" font-weight="bold">A   Conceptual optical-to-syndrome workflow</text>
<rect x="120" y="455" width="615" height="365" rx="18" fill="#2a6d94" fill-opacity="0.06" stroke="#2a6d94" stroke-width="4"/>
<text x="427.5" y="528" font-size="36" text-anchor="middle" class="" font-weight="bold">Prepared photonic mode</text>
<text x="427.5" y="607" font-size="33" text-anchor="middle" class="muted" font-weight="normal">Optical input / encoding</text>
<text x="427.5" y="665" font-size="33" text-anchor="middle" class="muted" font-weight="normal">SPDC is one source</text>
<text x="427.5" y="723" font-size="33" text-anchor="middle" class="muted" font-weight="normal">discussed in the manuscript</text>
<rect x="835" y="455" width="615" height="365" rx="18" fill="#b45b23" fill-opacity="0.06" stroke="#b45b23" stroke-width="4"/>
<text x="1142.5" y="528" font-size="36" text-anchor="middle" class="" font-weight="bold">Propagation and errors</text>
<text x="1142.5" y="607" font-size="33" text-anchor="middle" class="muted" font-weight="normal">Loss; dephasing</text>
<text x="1142.5" y="665" font-size="33" text-anchor="middle" class="muted" font-weight="normal">Mode mixing</text>
<text x="1142.5" y="723" font-size="33" text-anchor="middle" class="muted" font-weight="normal">Spectral drift</text>
<rect x="1550" y="455" width="615" height="365" rx="18" fill="#638348" fill-opacity="0.06" stroke="#638348" stroke-width="4"/>
<text x="1857.5" y="528" font-size="36" text-anchor="middle" class="" font-weight="bold">Selected observables</text>
<text x="1857.5" y="607" font-size="33" text-anchor="middle" class="muted" font-weight="normal">Geometric / spectral /</text>
<text x="1857.5" y="665" font-size="33" text-anchor="middle" class="muted" font-weight="normal">polarization deviations</text>
<text x="1857.5" y="723" font-size="33" text-anchor="middle" class="muted" font-weight="normal">Weak or QND sampling proposed</text>
<rect x="2265" y="455" width="615" height="365" rx="18" fill="#2a6d94" fill-opacity="0.06" stroke="#2a6d94" stroke-width="4"/>
<text x="2572.5" y="528" font-size="36" text-anchor="middle" class="" font-weight="bold">Syndrome representation</text>
<text x="2572.5" y="607" font-size="33" text-anchor="middle" class="muted" font-weight="normal">Deviation vector S<tspan dy="12" font-size="68%">ph</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="2572.5" y="665" font-size="33" text-anchor="middle" class="muted" font-weight="normal">Mathematical description</text>
<text x="2572.5" y="723" font-size="33" text-anchor="middle" class="muted" font-weight="normal">for the proposed framework</text>
<line x1="745" y1="638" x2="820" y2="638" stroke="#2a6d94" stroke-width="6" marker-end="url(#tangent)"/>
<line x1="1460" y1="638" x2="1535" y2="638" stroke="#2a6d94" stroke-width="6" marker-end="url(#tangent)"/>
<line x1="2175" y1="638" x2="2250" y2="638" stroke="#2a6d94" stroke-width="6" marker-end="url(#tangent)"/>
<text x="120" y="901" font-size="34" text-anchor="start" class="muted" font-weight="normal">Boxes indicate proposed functions, not a specified or experimentally validated optical circuit.</text>
<line x1="120" y1="959" x2="2880" y2="959" stroke="#c6d0d8" stroke-width="3"/>
<line x1="1660" y1="1010" x2="1660" y2="1530" stroke="#c6d0d8" stroke-width="3"/>
<text x="120" y="1050" font-size="43" text-anchor="start" class="" font-weight="bold">B   Syndrome components</text>
<text x="1770" y="1050" font-size="43" text-anchor="start" class="" font-weight="bold">C   Geometric correction target</text>
<text x="120" y="1147" font-size="54" text-anchor="start" class="math" font-weight="normal">S<tspan dy="12" font-size="68%">ph</tspan><tspan dy="-12">&#8203;</tspan> = (Δκ<tspan dy="12" font-size="68%">ph</tspan><tspan dy="-12">&#8203;</tspan>, Δτ<tspan dy="12" font-size="68%">g,ph</tspan><tspan dy="-12">&#8203;</tspan>, Δω, Δθ<tspan dy="12" font-size="68%">pol</tspan><tspan dy="-12">&#8203;</tspan>)</text>
<text x="120" y="1236" font-size="40" text-anchor="start" class="math" font-weight="normal">Δκ<tspan dy="12" font-size="68%">ph</tspan><tspan dy="-12">&#8203;</tspan>: curvature deviation</text>
<text x="120" y="1303" font-size="40" text-anchor="start" class="math" font-weight="normal">Δτ<tspan dy="12" font-size="68%">g,ph</tspan><tspan dy="-12">&#8203;</tspan>: torsion deviation</text>
<text x="120" y="1370" font-size="40" text-anchor="start" class="math" font-weight="normal">Δω: frequency deviation</text>
<text x="120" y="1437" font-size="40" text-anchor="start" class="math" font-weight="normal">Δθ<tspan dy="12" font-size="68%">pol</tspan><tspan dy="-12">&#8203;</tspan>: polarization-angle deviation</text>
<text x="1770" y="1147" font-size="59" text-anchor="start" class="math" font-weight="normal">C = Π<tspan dy="12" font-size="68%">Σph</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="1770" y="1236" font-size="51" text-anchor="start" class="math" font-weight="normal">κ<tspan dy="12" font-size="68%">ph</tspan><tspan dy="-12">&#8203;</tspan> = κ<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan> ;  τ<tspan dy="12" font-size="68%">g,ph</tspan><tspan dy="-12">&#8203;</tspan> = τ<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="1770" y="1311" font-size="46" text-anchor="start" class="math" font-weight="normal">I<tspan dy="-20" font-size="68%">a</tspan><tspan dy="20">&#8203;</tspan> = I<tspan dy="-20" font-size="68%">a</tspan><tspan dy="20">&#8203;</tspan><tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan> ;  a ∈ {O, A, S, W}</text>
<text x="1770" y="1386" font-size="46" text-anchor="start" class="math" font-weight="normal">dI<tspan dy="-20" font-size="68%">a</tspan><tspan dy="20">&#8203;</tspan>/dτ = 0 ;  d<tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan>I<tspan dy="-20" font-size="68%">a</tspan><tspan dy="20">&#8203;</tspan>/dτ<tspan dy="-20" font-size="68%">2</tspan><tspan dy="20">&#8203;</tspan> = 0</text>
<text x="1770" y="1471" font-size="35" text-anchor="start" class="muted" font-weight="normal">Target conditions stated for Σ<tspan dy="12" font-size="68%">ph</tspan><tspan dy="-12">&#8203;</tspan></text>
<line x1="120" y1="1650" x2="2880" y2="1650" stroke="#c6d0d8" stroke-width="3"/>
<text x="120" y="1720" font-size="33" text-anchor="start" class="muted" font-weight="normal">Conceptual proposal; no syndrome-to-actuator implementation, loss recovery or correction performance is demonstrated here.</text>
</svg>