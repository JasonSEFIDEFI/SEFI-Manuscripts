<text x="320" y="610" font-size="49" text-anchor="start" class="math" font-weight="normal" style="fill:#176779">Stability manifold Σ</text>
<line x1="490" y1="637" x2="530" y2="878.1241554049922" stroke="#176779" stroke-width="2"/>
<line x1="850.0" y1="1120.0" x2="1200.0" y2="1120.0" stroke="#b45b23" stroke-width="6" marker-end="url(#normal)"/>
<line x1="1200.0" y1="1120.0" x2="1200.0" y2="650.0" stroke="#638348" stroke-width="6" marker-end="url(#binormal)"/>
