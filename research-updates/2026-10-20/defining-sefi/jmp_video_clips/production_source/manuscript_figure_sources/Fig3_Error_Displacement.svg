<circle cx="1200.0" cy="650.0" r="16" fill="#162332" stroke="white" stroke-width="4"/>
<circle cx="1200.0" cy="1120.0" r="8" fill="white" stroke="#53616b" stroke-width="3"/>
<text x="1215" y="595" font-size="60" text-anchor="start" class="math" font-weight="normal">(x, I)</text>
<text x="940" y="855" font-size="64" text-anchor="start" class="math" font-weight="normal" style="fill:#2a6d94">D</text>
<text x="1050" y="1190" font-size="59" text-anchor="start" class="math" font-weight="normal" style="fill:#b45b23">D<tspan dy="12" font-size="68%">M</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="1260" y="920" font-size="59" text-anchor="start" class="math" font-weight="normal" style="fill:#638348">D<tspan dy="12" font-size="68%">I</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="180" y="1290" font-size="48" text-anchor="start" class="math" font-weight="normal">Π<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan>(x, I) = (x<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan>, I<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan>)</text>
<line x1="660" y1="1240" x2="831" y2="1143" stroke="#c6d0d8" stroke-width="2"/>
<text x="210" y="1510" font-size="34" text-anchor="start" class="muted" font-weight="normal">D points from the projected point to the displaced state.</text>
<text x="1840" y="464" font-size="39" text-anchor="start" class="" font-weight="bold">Product-space displacement</text>
<text x="1840" y="536" font-size="49" text-anchor="start" class="math" font-weight="normal">D(x, I) = (x, I) − Π<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan>(x, I)</text>
<text x="1840" y="612" font-size="54" text-anchor="start" class="math" font-weight="normal">D = D<tspan dy="12" font-size="68%">M</tspan><tspan dy="-12">&#8203;</tspan> + D<tspan dy="12" font-size="68%">I</tspan><tspan dy="-12">&#8203;</tspan></text>
<line x1="1840" y1="662" x2="2880" y2="662" stroke="#c6d0d8" stroke-width="3"/>
<text x="1840" y="740" font-size="39" text-anchor="start" class="" font-weight="bold">Spacetime component</text>
<text x="1840" y="810" font-size="54" text-anchor="start" class="math" font-weight="normal">D<tspan dy="12" font-size="68%">M</tspan><tspan dy="-12">&#8203;</tspan> = x − x<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="1840" y="881" font-size="51" text-anchor="start" class="math" font-weight="normal">d<tspan dy="12" font-size="68%">M</tspan><tspan dy="-12">&#8203;</tspan> = d<tspan dy="12" font-size="68%">T</tspan><tspan dy="-12">&#8203;</tspan>T + d<tspan dy="12" font-size="68%">N</tspan><tspan dy="-12">&#8203;</tspan>N + d<tspan dy="12" font-size="68%">B</tspan><tspan dy="-12">&#8203;</tspan>B</text>
<text x="1840" y="939" font-size="33" text-anchor="start" class="muted" font-weight="normal">T, N, B: tangent, normal and binormal</text>
<line x1="1840" y1="988" x2="2880" y2="988" stroke="#c6d0d8" stroke-width="3"/>
<text x="1840" y="1066" font-size="39" text-anchor="start" class="" font-weight="bold">Identity-space component</text>
<text x="1840" y="1138" font-size="54" text-anchor="start" class="math" font-weight="normal">D<tspan dy="12" font-size="68%">I</tspan><tspan dy="-12">&#8203;</tspan> = I − I<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="1840" y="1209" font-size="48" text-anchor="start" class="math" font-weight="normal">Components: d<tspan dy="12" font-size="68%">O</tspan><tspan dy="-12">&#8203;</tspan>, d<tspan dy="12" font-size="68%">A</tspan><tspan dy="-12">&#8203;</tspan>, d<tspan dy="12" font-size="68%">S</tspan><tspan dy="-12">&#8203;</tspan>, d<tspan dy="12" font-size="68%">W</tspan><tspan dy="-12">&#8203;</tspan></text>
<text x="1840" y="1267" font-size="32" text-anchor="start" class="muted" font-weight="normal">Origin, Authorship, Sovereignty, Warp Expression</text>
<line x1="1840" y1="1318" x2="2880" y2="1318" stroke="#c6d0d8" stroke-width="3"/>
<text x="1840" y="1396" font-size="39" text-anchor="start" class="" font-weight="bold">Geometric invariant deviations</text>
<text x="1840" y="1468" font-size="50" text-anchor="start" class="math" font-weight="normal">Δκ = κ − κ<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan> ;  Δτ<tspan dy="12" font-size="68%">g</tspan><tspan dy="-12">&#8203;</tspan> = τ<tspan dy="12" font-size="68%">g</tspan><tspan dy="-12">&#8203;</tspan> − τ<tspan dy="12" font-size="68%">Σ</tspan><tspan dy="-12">&#8203;</tspan></text>
<line x1="120" y1="1650" x2="2880" y2="1650" stroke="#c6d0d8" stroke-width="3"/>
<text x="120" y="1720" font-size="33" text-anchor="start" class="muted" font-weight="normal">Local coordinate illustration; projection is assumed where defined and unique. No displacement magnitudes are calculated.</text>
